<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador Colón - Entre Ríos</title>
    <style>
        body { margin: 0; background: #ffffff; color: #333; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        
        /* Capas de Interfaz */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; transition: opacity 0.5s; }
        
        /* Intro */
        #intro-screen { background: white; }
        #intro-screen h1 { color: #2c3e50; font-size: 28px; margin-bottom: 5px; }
        #intro-screen h2 { color: #e67e22; font-size: 18px; margin-top: 0; }
        
        /* Cementerio */
        #cemetery-screen { background: rgba(0, 0, 0, 0.9); color: #ecf0f1; display: none; }
        #cemetery-screen h1 { font-size: 50px; color: #95a5a6; margin-bottom: 10px; }
        #cemetery-screen p { font-size: 20px; color: #e74c3c; }

        .btn-start { padding: 15px 30px; font-size: 18px; background: #2c3e50; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; pointer-events: auto; }

        /* Paneles de Control */
        .ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .info-panel { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 12px; width: 120px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .val { color: #d35400; font-family: monospace; font-size: 14px; font-weight: bold; }
        
        #volante-visual { width: 70px; height: 70px; border: 6px solid #1a1a1a; border-radius: 50%; margin: 10px auto 0; position: relative; box-sizing: border-box; background: #2c3e50; }
        #volante-visual::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 6px; background: #1a1a1a; transform: translateY(-50%); }
        #volante-visual::after { content: ''; position: absolute; top: 50%; left: 50%; width: 6px; height: 50%; background: #ff0000; transform: translateX(-50%); }

        .level-panel { position: absolute; top: 20px; left: 160px; display: flex; gap: 5px; pointer-events: auto; }
        .btn-lvl { padding: 8px 12px; background: #222; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 11px; }
        .btn-lvl.active { background: #e67e22; }

        .controls-container { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: auto; }
        .control-group { display: flex; gap: 10px; }
        .btn { width: 70px; height: 70px; border-radius: 12px; border: none; color: white; font-weight: bold; font-size: 12px; box-shadow: 0 4px #555; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #555; }
        .btn-steer { background: #444; } 
        .btn-drive { background: #2ecc71; } 
        .btn-reverse { background: #f1c40f; color: #333; } 
        .btn-brake { background: #e74c3c; width: 80px; }
    </style>
</head>
<body>

    <div id="intro-screen" class="overlay">
        <h1>Primer ejercicio: Slalom</h1>
        <h2>Colón, Entre Ríos</h2>
        <p><i>"Si le erro voy al cementerio"</i></p>
        <button class="btn-start" onclick="startGame()">INICIAR EJERCICIO</button>
    </div>

    <div id="cemetery-screen" class="overlay">
        <h1>🪦</h1>
        <h1>AL CEMENTERIO</h1>
        <p>Tocaste un cono. Ejercicio fallido.</p>
        <button class="btn-start" onclick="resetGame()">REINTENTAR</button>
    </div>

    <canvas id="simCanvas"></canvas>

    <div class="ui-layer" id="game-ui" style="display:none;">
        <div class="info-panel">
            <div class="lvl-hide">VUELTAS: <br><span id="vueltas" class="val">0.00</span></div>
            <div id="volante-visual"></div>
        </div>

        <div class="level-panel">
            <button class="btn-lvl active" onclick="setLvl(0)">INICIO</button>
            <button class="btn-lvl" onclick="setLvl(1)">NIVEL 1</button>
            <button class="btn-lvl" onclick="setLvl(2)">NIVEL 2</button>
        </div>

        <div class="controls-container">
            <div class="control-group">
                <button class="btn btn-steer" id="btn-left">Izq</button>
                <button class="btn btn-steer" id="btn-right">Der</button>
            </div>
            <div class="control-group">
                <button class="btn btn-brake" id="btn-brake">Freno</button>
                <button class="btn btn-reverse" id="btn-back">Rev</button>
                <button class="btn btn-drive" id="btn-forward">D</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const M_TO_PX = 35; // Escala
    const STREET_W = 7 * M_TO_PX;
    const STREET_L = 90 * M_TO_PX;

    let isGameOver = false;
    let currentLevel = 0;
    let cameraScale = 0.7;
    const inputs = { left: false, right: false, forward: false, back: false, brake: false };

    const car = {
        x: 0, y: 0, width: 1.6 * M_TO_PX, height: 3.8 * M_TO_PX,
        angle: 0, wheelAngleDeg: 0, maxWheelAngle: 504,
        steeringRatio: 16, speed: 0, maxSpeed: 6, accel: 0.12, friction: 0.98
    };

    const cones = [];
    function initCones() {
        cones.length = 0;
        const firstX = 25 * M_TO_PX;
        const lastX = 85 * M_TO_PX;
        const spacing = (lastX - firstX) / 4;
        for(let i=0; i<5; i++) {
            cones.push({ x: firstX + (i * spacing), y: 3.5 * M_TO_PX, r: 8 });
        }
    }

    function startGame() {
        document.getElementById('intro-screen').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        resetGame();
    }

    function resetGame() {
        isGameOver = false;
        car.x = 10 * M_TO_PX;
        car.y = 5.5 * M_TO_PX;
        car.speed = 0;
        car.angle = 0;
        car.wheelAngleDeg = 0;
        initCones();
        document.getElementById('cemetery-screen').style.display = 'none';
    }

    function gameOver() {
        isGameOver = true;
        document.getElementById('cemetery-screen').style.display = 'flex';
    }

    function setLvl(lvl) {
        currentLevel = lvl;
        document.querySelectorAll('.btn-lvl').forEach((b, i) => b.classList.toggle('active', i === lvl));
        document.querySelectorAll('.lvl-hide').forEach(el => el.style.display = (lvl === 0) ? 'block' : 'none');
    }

    // Inputs
    const setupBtn = (id, k) => {
        const b = document.getElementById(id);
        const s = (e) => { e.preventDefault(); inputs[k] = true; };
        const f = () => inputs[k] = false;
        ['touchstart','mousedown'].forEach(e => b.addEventListener(e, s));
        ['touchend','mouseup','mouseleave'].forEach(e => b.addEventListener(e, f));
    };
    setupBtn('btn-left','left'); setupBtn('btn-right','right');
    setupBtn('btn-forward','forward'); setupBtn('btn-back','back');
    setupBtn('btn-brake','brake');

    function update() {
        if(isGameOver) return;

        // Movimiento
        if (inputs.left) car.wheelAngleDeg -= 4.5;
        if (inputs.right) car.wheelAngleDeg += 4.5;
        car.wheelAngleDeg = Math.max(-car.maxWheelAngle, Math.min(car.maxWheelAngle, car.wheelAngleDeg));

        if (inputs.brake) car.speed *= 0.85;
        else if (inputs.forward) car.speed += car.accel;
        else if (inputs.back) car.speed -= car.accel;
        else car.speed *= car.friction;

        const steerRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);
        if (Math.abs(car.speed) > 0.1) {
            car.angle += (steerRad * car.speed) / 180;
        }

        car.x += Math.cos(car.angle) * car.speed;
        car.y += Math.sin(car.angle) * car.speed;

        // Detección de colisión con conos
        cones.forEach(cone => {
            const dx = car.x - cone.x;
            const dy = car.y - cone.y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            if(distance < 25) { // Si el centro del auto está cerca del cono
                gameOver();
            }
        });

        document.getElementById('vueltas').innerText = (car.wheelAngleDeg / 360).toFixed(2);
        document.getElementById('volante-visual').style.transform = `rotate(${car.wheelAngleDeg}deg)`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0,0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(cameraScale, cameraScale);
        ctx.translate(-car.x, -car.y);

        // Calle
        ctx.fillStyle = "#f5f5f5";
        ctx.fillRect(0, 0, STREET_L, STREET_W);
        ctx.strokeStyle = "#ccc"; ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, STREET_L, STREET_W);

        // Conos
        cones.forEach(c => {
            ctx.fillStyle = "#e67e22"; ctx.beginPath(); ctx.arc(c.x, c.y, 10, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(c.x, c.y, 4, 0, Math.PI*2); ctx.fill();
        });

        // Auto
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);
        ctx.fillStyle = "#2c3e50"; 
        ctx.fillRect(-car.height/2, -car.width/2, car.height, car.width);
        
        if (currentLevel < 2) {
            const sRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);
            const drawW = (tx, ty, rot) => {
                ctx.save(); ctx.translate(tx, ty); ctx.rotate(rot);
                ctx.fillStyle = "#111"; ctx.fillRect(-12, -6, 24, 12); ctx.restore();
            };
            drawW(car.height/2.5, -car.width/2, sRad); drawW(car.height/2.5, car.width/2, sRad);
            drawW(-car.height/2.5, -car.width/2, 0); drawW(-car.height/2.5, car.width/2, 0);
        }
        ctx.restore();
        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    loop();
</script>
</body>
</html>
