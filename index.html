<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador: Volante Fijo</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: #00ff00; font-family: 'Courier New', monospace; overflow: hidden; }
        canvas { display: block; background: #222; margin: 20px auto; border: 2px solid #444; }
        .ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #444; }
        .highlight { color: #fff; font-weight: bold; }
        #volanteVisual { width: 100px; height: 100px; border: 5px solid #555; border-radius: 50%; margin-top: 10px; position: relative; transition: transform 0.1s; }
        #volanteVisual::before { content: ''; position: absolute; top: 0; left: 45%; width: 10%; height: 50%; background: #ff4444; }
    </style>
</head>
<body>
    <div class="ui">
        <div class="stat">Vueltas: <span id="vueltas" class="highlight">0.00</span></div>
        <div class="stat">Ángulo Volante: <span id="angVolante" class="highlight">0</span>°</div>
        <hr>
        <div id="volanteVisual"></div>
        <p><small>Las ruedas NO vuelven solas al soltar.</small></p>
    </div>
    <canvas id="simCanvas"></canvas>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const volanteDiv = document.getElementById('volanteVisual');
    
    canvas.width = window.innerWidth * 0.9;
    canvas.height = 600;

    const car = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        width: 40,
        height: 80,
        angle: -Math.PI / 2,
        
        // Lógica del volante
        wheelAngleDeg: 0,      
        maxWheelAngle: 540,    // 1.5 vueltas
        steeringRatio: 15,     
        
        speed: 0,
        accel: 0.15,
        friction: 0.96
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function update() {
        // 1. Manejo del Volante (SIN RETORNO AUTOMÁTICO)
        if (keys['ArrowLeft']) {
            car.wheelAngleDeg -= 5; 
        } else if (keys['ArrowRight']) {
            car.wheelAngleDeg += 5;
        }
        // Se ha eliminado la línea: car.wheelAngleDeg *= 0.92;

        // Limitar giro máximo
        if (car.wheelAngleDeg > car.maxWheelAngle) car.wheelAngleDeg = car.maxWheelAngle;
        if (car.wheelAngleDeg < -car.maxWheelAngle) car.wheelAngleDeg = -car.maxWheelAngle;

        // 2. Ángulo de las ruedas para la física
        const steerAngleRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);

        // 3. Movimiento
        if (keys['ArrowUp']) car.speed += car.accel;
        if (keys['ArrowDown']) car.speed -= car.accel;
        car.speed *= car.friction;

        if (Math.abs(car.speed) > 0.1) {
            car.angle += (steerAngleRad * car.speed) / 100;
        }

        car.x += Math.cos(car.angle) * car.speed;
        car.y += Math.sin(car.angle) * car.speed;

        // 4. Actualizar Interfaz
        document.getElementById('angVolante').innerText = Math.round(car.wheelAngleDeg);
        document.getElementById('vueltas').innerText = (car.wheelAngleDeg / 360).toFixed(2);
        volanteDiv.style.transform = `rotate(${car.wheelAngleDeg}deg)`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dibujar el auto
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);

        // Cuerpo
        ctx.fillStyle = "#3366ff";
        ctx.fillRect(-car.height/2, -car.width/2, car.height, car.width);
        
        // Ruedas traseras (fijas)
        ctx.fillStyle = "#111";
        ctx.fillRect(-30, -22, 15, 6);
        ctx.fillRect(-30, 16, 15, 6);

        // Ruedas delanteras (rotan según el volante y quedan fijas)
        const steerAngleRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);
        drawWheel(25, -20, steerAngleRad);
        drawWheel(25, 20, steerAngleRad);

        ctx.restore();
    }

    function drawWheel(x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = "#ff4444";
        ctx.fillRect(-10, -4, 20, 8); // Rueda inclinada
        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
