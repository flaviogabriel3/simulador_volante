<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador V5 - Control de Cámara</title>
    <style>
        body { margin: 0; background: #ecf0f1; color: #333; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }

        /* UI Capas */
        .ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Panel de Información (Top Izquierda) */
        .info-panel { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .info-panel div { margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .val { color: #d35400; }
        #volante-visual { width: 40px; height: 40px; border: 3px solid #333; border-radius: 50%; margin: 5px auto 0; position: relative; }
        #volante-visual::after { content: ''; position: absolute; top: 0; left: 50%; width: 3px; height: 50%; background: #c0392b; transform: translateX(-50%); }

        /* Panel de Cámara (Top Derecha) */
        .camera-panel { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .btn-cam { width: 45px; height: 45px; background: white; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; font-size: 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-cam:active { background: #f0f0f0; transform: scale(0.95); }
        .btn-fs { width: 120px; font-size: 12px; text-transform: uppercase; }

        /* Controles de Manejo (Abajo) */
        .controls-container { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: auto; }
        .control-group { display: flex; gap: 10px; }
        .btn { width: 75px; height: 75px; border-radius: 15px; border: none; font-weight: bold; color: white; cursor: pointer; user-select: none; font-size: 13px; text-transform: uppercase; box-shadow: 0 4px #999; }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 #999; }
        .btn-steer { background: #7f8c8d; } 
        .btn-drive { background: #27ae60; } 
        .btn-reverse { background: #f39c12; color: #333; } 
        .btn-brake { background: #c0392b; width: 85px; }
    </style>
</head>
<body>

    <canvas id="simCanvas"></canvas>

    <div class="ui-layer">
        <div class="info-panel">
            <div>Vueltas: <span id="vueltas" class="val">0.00</span></div>
            <div>Zoom: <span id="zoomVal" class="val">100</span>%</div>
            <div id="volante-visual"></div>
        </div>

        <div class="camera-panel">
            <button class="btn-cam btn-fs" id="btn-fullscreen">Pantalla Completa</button>
            <button class="btn-cam" id="btn-zoom-in" title="Acercar">+</button>
            <button class="btn-cam" id="btn-zoom-out" title="Alejar">−</button>
            <button class="btn-cam" id="btn-zoom-reset" title="Restaurar">⟲</button>
        </div>

        <div class="controls-container">
            <div class="control-group">
                <button class="btn btn-steer" id="btn-left">Izq</button>
                <button class="btn btn-steer" id="btn-right">Der</button>
            </div>
            <div class="control-group">
                <button class="btn btn-brake" id="btn-brake">Freno</button>
                <button class="btn btn-reverse" id="btn-back">Rev</button>
                <button class="btn btn-drive" id="btn-forward">D</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const volanteUI = document.getElementById('volante-visual');

    let cameraScale = 1.0; // Escala de la cámara (1.0 es 100%)

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const inputs = { left: false, right: false, forward: false, back: false, brake: false };

    const car = {
        x: 0, y: 0, width: 42, height: 84,
        angle: -Math.PI / 2,
        wheelAngleDeg: 0,
        maxWheelAngle: 720,
        steeringRatio: 18,
        speed: 0, maxSpeed: 7.5, accel: 0.18, friction: 0.97
    };

    const cones = [
        { x: 300, y: -100 },
        { x: 520, y: -100 }
    ];

    // --- LÓGICA DE BOTONES ---
    const setupButton = (id, key) => {
        const btn = document.getElementById(id);
        const start = (e) => { e.preventDefault(); inputs[key] = true; };
        const end = () => inputs[key] = false;
        ['touchstart', 'mousedown'].forEach(e => btn.addEventListener(e, start));
        ['touchend', 'mouseup', 'mouseleave'].forEach(e => btn.addEventListener(e, end));
    };
    setupButton('btn-left', 'left'); setupButton('btn-right', 'right');
    setupButton('btn-forward', 'forward'); setupButton('btn-back', 'back');
    setupButton('btn-brake', 'brake');

    // --- LÓGICA DE CÁMARA ---
    document.getElementById('btn-zoom-in').onclick = () => { if(cameraScale < 2.5) cameraScale += 0.1; };
    document.getElementById('btn-zoom-out').onclick = () => { if(cameraScale > 0.4) cameraScale -= 0.1; };
    document.getElementById('btn-zoom-reset').onclick = () => { cameraScale = 1.0; };
    
    document.getElementById('btn-fullscreen').onclick = () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`Error al intentar modo pantalla completa: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    };

    function update() {
        // Manejo de volante
        if (inputs.left) car.wheelAngleDeg -= 4.5;
        if (inputs.right) car.wheelAngleDeg += 4.5;
        car.wheelAngleDeg = Math.max(-car.maxWheelAngle, Math.min(car.maxWheelAngle, car.wheelAngleDeg));

        // Tracción
        if (inputs.brake) car.speed *= 0.85;
        else if (inputs.forward) car.speed += car.accel;
        else if (inputs.back) car.speed -= car.accel;
        else car.speed *= car.friction;

        if (car.speed > car.maxSpeed) car.speed = car.maxSpeed;
        if (car.speed < -car.maxSpeed/2) car.speed = -car.maxSpeed/2;

        const steerAngleRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);
        if (Math.abs(car.speed) > 0.1) {
            car.angle += (steerAngleRad * car.speed) / 130;
        }

        car.x += Math.cos(car.angle) * car.speed;
        car.y += Math.sin(car.angle) * car.speed;

        // UI
        document.getElementById('vueltas').innerText = (car.wheelAngleDeg / 360).toFixed(2);
        document.getElementById('zoomVal').innerText = Math.round(cameraScale * 100);
        volanteUI.style.transform = `rotate(${car.wheelAngleDeg}deg)`;
    }

    function drawGrid() {
        ctx.save();
        ctx.strokeStyle = "#ccc";
        ctx.lineWidth = 1 / cameraScale; // Mantener líneas finas al hacer zoom
        const gridSize = 100;

        const startX = Math.floor((car.x - (canvas.width/2)/cameraScale) / gridSize) * gridSize - gridSize;
        const endX = startX + (canvas.width/cameraScale) + gridSize * 2;
        const startY = Math.floor((car.y - (canvas.height/2)/cameraScale) / gridSize) * gridSize - gridSize;
        const endY = startY + (canvas.height/cameraScale) + gridSize * 2;

        ctx.beginPath();
        for (let x = startX; x < endX; x += gridSize) {
            ctx.moveTo(x, startY); ctx.lineTo(x, endY);
        }
        for (let y = startY; y < endY; y += gridSize) {
            ctx.moveTo(startX, y); ctx.lineTo(endX, y);
        }
        ctx.stroke();
        ctx.restore();
    }

    function drawCone(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "#e67e22";
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#d35400";
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ecf0f1";
        ctx.fillRect(0,0, canvas.width, canvas.height);
        
        ctx.save();

        // 1. Centrar en pantalla
        ctx.translate(canvas.width / 2, canvas.height / 2);
        
        // 2. Aplicar Zoom
        ctx.scale(cameraScale, cameraScale);
        
        // 3. Seguir al auto
        ctx.translate(-car.x, -car.y);

        drawGrid();
        cones.forEach(cone => drawCone(cone.x, cone.y));

        // Dibujar Auto
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);
        
        // Sombra
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(-car.height/2 + 4, -car.width/2 + 4, car.height, car.width);

        // Chasis
        ctx.fillStyle = "#2c3e50"; 
        ctx.fillRect(-car.height/2, -car.width/2, car.height, car.width);
        
        // Cristal
        ctx.fillStyle = "#85c1e9";
        ctx.fillRect(14, -car.width/2 + 5, 18, car.width - 10);

        // Ruedas
        const steerAngleRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);
        drawWheel(24, -20, steerAngleRad); drawWheel(24, 20, steerAngleRad);
        drawWheel(-24, -20, 0); drawWheel(-24, 20, 0);

        ctx.restore();
        ctx.restore();
    }

    function drawWheel(x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(-11, -5, 22, 10);
        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
