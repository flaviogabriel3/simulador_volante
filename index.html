<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador V7 - Niveles de Desafío</title>
    <style>
        body { margin: 0; background: #ffffff; color: #333; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Panel de Información */
        .info-panel { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 150px; text-align: center; }
        .info-panel div { margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        .val { color: #d35400; font-family: monospace; font-size: 16px; }
        
        /* Volante con guía hacia abajo y barra horizontal */
        #volante-visual { width: 70px; height: 70px; border: 5px solid #2c3e50; border-radius: 50%; margin: 10px auto 0; position: relative; box-sizing: border-box; }
        /* Barra Horizontal */
        #volante-visual::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 5px; background: #2c3e50; transform: translateY(-50%); }
        /* Guía Roja hacia ABAJO */
        #volante-visual::after { content: ''; position: absolute; top: 50%; left: 50%; width: 5px; height: 50%; background: #e74c3c; transform: translateX(-50%); }

        /* Panel de Niveles */
        .level-panel { position: absolute; top: 20px; left: 190px; display: flex; gap: 10px; pointer-events: auto; }
        .btn-lvl { padding: 10px 15px; background: #34495e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-lvl.active { background: #e67e22; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3); }

        /* Panel de Cámara */
        .camera-panel { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
        .btn-cam { width: 44px; height: 44px; background: white; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }

        /* Controles de Manejo */
        .controls-container { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 25px; box-sizing: border-box; pointer-events: auto; }
        .control-group { display: flex; gap: 12px; }
        .btn { width: 75px; height: 75px; border-radius: 15px; border: none; font-weight: bold; color: white; cursor: pointer; font-size: 13px; text-transform: uppercase; box-shadow: 0 4px #7f8c8d; }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 #7f8c8d; }
        .btn-steer { background: #34495e; } 
        .btn-drive { background: #27ae60; } 
        .btn-reverse { background: #f1c40f; color: #333; } 
        .btn-brake { background: #e74c3c; width: 85px; }
    </style>
</head>
<body>

    <canvas id="simCanvas"></canvas>

    <div class="ui-layer">
        <div class="info-panel" id="main-info">
            <div class="lvl-hide">VUELTAS: <br><span id="vueltas" class="val">0.00</span></div>
            <div class="lvl-hide">GIRO: <span id="angRuedas" class="val">0</span>°</div>
            <div id="volante-visual"></div>
        </div>

        <div class="level-panel">
            <button class="btn-lvl active" onclick="setLvl(0)">INICIO</button>
            <button class="btn-lvl" onclick="setLvl(1)">NIVEL 1</button>
            <button class="btn-lvl" onclick="setLvl(2)">NIVEL 2</button>
        </div>

        <div class="camera-panel">
            <button class="btn-cam" id="btn-zoom-in">+</button>
            <button class="btn-cam" id="btn-zoom-out">−</button>
        </div>

        <div class="controls-container">
            <div class="control-group">
                <button class="btn btn-steer" id="btn-left">Izq</button>
                <button class="btn btn-steer" id="btn-right">Der</button>
            </div>
            <div class="control-group">
                <button class="btn btn-brake" id="btn-brake">Freno</button>
                <button class="btn btn-reverse" id="btn-back">Rev</button>
                <button class="btn btn-drive" id="btn-forward">D</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const volanteUI = document.getElementById('volante-visual');
    const infoElements = document.querySelectorAll('.lvl-hide');

    let currentLevel = 0;
    let cameraScale = 1.0;
    const inputs = { left: false, right: false, forward: false, back: false, brake: false };

    const car = {
        x: 0, y: 0, width: 42, height: 84,
        angle: -Math.PI / 2,
        wheelAngleDeg: 0,
        maxWheelAngle: 504, // 1.4 vueltas por lado = 2.8 total
        steeringRatio: 15,
        speed: 0, maxSpeed: 7, accel: 0.15, friction: 0.98
    };

    const cones = [ { x: 350, y: -80 }, { x: 580, y: -80 } ];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    // Lógica de Niveles
    function setLvl(lvl) {
        currentLevel = lvl;
        document.querySelectorAll('.btn-lvl').forEach((b, i) => {
            b.classList.toggle('active', i === lvl);
        });

        // Nivel 1 y 2 desactivan la info de ángulos
        const showInfo = (lvl === 0);
        infoElements.forEach(el => el.style.display = showInfo ? 'block' : 'none');
    }

    const setupButton = (id, key) => {
        const btn = document.getElementById(id);
        const start = (e) => { e.preventDefault(); inputs[key] = true; };
        const end = () => inputs[key] = false;
        ['touchstart', 'mousedown'].forEach(e => btn.addEventListener(e, start));
        ['touchend', 'mouseup', 'mouseleave'].forEach(e => btn.addEventListener(e, end));
    };
    setupButton('btn-left', 'left'); setupButton('btn-right', 'right');
    setupButton('btn-forward', 'forward'); setupButton('btn-back', 'back');
    setupButton('btn-brake', 'brake');

    document.getElementById('btn-zoom-in').onclick = () => cameraScale += 0.1;
    document.getElementById('btn-zoom-out').onclick = () => cameraScale -= 0.1;

    function update() {
        if (inputs.left) car.wheelAngleDeg -= 4.8;
        if (inputs.right) car.wheelAngleDeg += 4.8;
        car.wheelAngleDeg = Math.max(-car.maxWheelAngle, Math.min(car.maxWheelAngle, car.wheelAngleDeg));

        if (inputs.brake) car.speed *= 0.88;
        else if (inputs.forward) car.speed += car.accel;
        else if (inputs.back) car.speed -= car.accel;
        else car.speed *= car.friction;

        const steerAngleRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);
        if (Math.abs(car.speed) > 0.1) {
            car.angle += (steerAngleRad * car.speed) / 140;
        }

        car.x += Math.cos(car.angle) * car.speed;
        car.y += Math.sin(car.angle) * car.speed;

        document.getElementById('vueltas').innerText = (car.wheelAngleDeg / 360).toFixed(2);
        document.getElementById('angRuedas').innerText = Math.round(car.wheelAngleDeg / car.steeringRatio);
        volanteUI.style.transform = `rotate(${car.wheelAngleDeg}deg)`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0,0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(cameraScale, cameraScale);
        ctx.translate(-car.x, -car.y);

        // Grid
        ctx.strokeStyle = "#f2f2f2";
        const gridSize = 100;
        const startX = Math.floor((car.x - (canvas.width/2)/cameraScale) / gridSize) * gridSize - gridSize;
        const endX = startX + (canvas.width/cameraScale) + gridSize * 2;
        const startY = Math.floor((car.y - (canvas.height/2)/cameraScale) / gridSize) * gridSize - gridSize;
        const endY = startY + (canvas.height/cameraScale) + gridSize * 2;
        ctx.beginPath();
        for(let x=startX; x<endX; x+=gridSize){ ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
        for(let y=startY; y<endY; y+=gridSize){ ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
        ctx.stroke();

        // Conos
        cones.forEach(c => {
            ctx.fillStyle = "#e67e22"; ctx.beginPath(); ctx.arc(c.x, c.y, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(c.x, c.y, 4, 0, Math.PI*2); ctx.fill();
        });

        // Auto
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);

        // Chasis
        ctx.fillStyle = "#2c3e50"; 
        ctx.fillRect(-car.height/2, -car.width/2, car.height, car.width);
        ctx.fillStyle = "#5dade2"; // Parabrisas
        ctx.fillRect(15, -car.width/2 + 5, 15, car.width - 10);
        
        // DIBUJAR RUEDAS (Solo si no es Nivel 2)
        if (currentLevel < 2) {
            const sRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);
            const drawW = (tx, ty, rot) => {
                ctx.save(); ctx.translate(tx, ty); ctx.rotate(rot);
                ctx.fillStyle = "#333"; ctx.fillRect(-10, -5, 20, 10); ctx.restore();
            };
            drawW(25, -20, sRad); drawW(25, 20, sRad);
            drawW(-25, -20, 0); drawW(-25, 20, 0);
        }

        ctx.restore();
        ctx.restore();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
</script>
</body>
</html>
