<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador V6 - 2.8 Vueltas</title>
    <style>
        body { margin: 0; background: #ecf0f1; color: #333; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Panel de Datos */
        .info-panel { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 140px; text-align: center; }
        .info-panel div { margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        .val { color: #d35400; font-family: monospace; font-size: 16px; }
        
        #volante-visual { width: 60px; height: 60px; border: 4px solid #2c3e50; border-radius: 50%; margin: 10px auto 0; position: relative; transition: transform 0.1s linear; }
        #volante-visual::after { content: ''; position: absolute; top: 0; left: 50%; width: 4px; height: 50%; background: #e74c3c; transform: translateX(-50%); }

        /* Panel de Cámara */
        .camera-panel { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
        .btn-cam { width: 44px; height: 44px; background: white; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .btn-fs { width: 100px; font-size: 11px; text-transform: uppercase; margin-bottom: 5px; }

        /* Controles de Manejo */
        .controls-container { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 25px; box-sizing: border-box; pointer-events: auto; }
        .control-group { display: flex; gap: 12px; }
        .btn { width: 75px; height: 75px; border-radius: 15px; border: none; font-weight: bold; color: white; cursor: pointer; user-select: none; font-size: 13px; text-transform: uppercase; box-shadow: 0 4px #7f8c8d; transition: all 0.1s; }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 #7f8c8d; }
        .btn-steer { background: #34495e; } 
        .btn-drive { background: #27ae60; box-shadow: 0 4px #1e8449; } 
        .btn-reverse { background: #f1c40f; color: #333; box-shadow: 0 4px #9a7d0a; } 
        .btn-brake { background: #e74c3c; width: 85px; box-shadow: 0 4px #922b21; }
    </style>
</head>
<body>

    <canvas id="simCanvas"></canvas>

    <div class="ui-layer">
        <div class="info-panel">
            <div>VUELTAS: <br><span id="vueltas" class="val">0.00</span></div>
            <div>GIRO: <span id="angRuedas" class="val">0</span>°</div>
            <div id="volante-visual"></div>
        </div>

        <div class="camera-panel">
            <button class="btn-cam btn-fs" id="btn-fullscreen">Full Screen</button>
            <button class="btn-cam" id="btn-zoom-in">+</button>
            <button class="btn-cam" id="btn-zoom-out">−</button>
            <button class="btn-cam" id="btn-zoom-reset">⟲</button>
        </div>

        <div class="controls-container">
            <div class="control-group">
                <button class="btn btn-steer" id="btn-left">Izq</button>
                <button class="btn btn-steer" id="btn-right">Der</button>
            </div>
            <div class="control-group">
                <button class="btn btn-brake" id="btn-brake">Freno</button>
                <button class="btn btn-reverse" id="btn-back">Rev</button>
                <button class="btn btn-drive" id="btn-forward">D</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const volanteUI = document.getElementById('volante-visual');

    let cameraScale = 1.0;
    const inputs = { left: false, right: false, forward: false, back: false, brake: false };

    const car = {
        x: 0, y: 0, width: 42, height: 84,
        angle: -Math.PI / 2,
        wheelAngleDeg: 0,
        // Límite para 2.8 vueltas totales (1.4 por lado)
        maxWheelAngle: 504, 
        steeringRatio: 15, // Ratio para que las ruedas giren aprox 33° a tope
        speed: 0, maxSpeed: 7, accel: 0.15, friction: 0.98
    };

    const cones = [ { x: 400, y: -50 }, { x: 610, y: -50 } ];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    // Setup de inputs
    const setupButton = (id, key) => {
        const btn = document.getElementById(id);
        const start = (e) => { e.preventDefault(); inputs[key] = true; };
        const end = () => inputs[key] = false;
        ['touchstart', 'mousedown'].forEach(e => btn.addEventListener(e, start));
        ['touchend', 'mouseup', 'mouseleave'].forEach(e => btn.addEventListener(e, end));
    };
    setupButton('btn-left', 'left'); setupButton('btn-right', 'right');
    setupButton('btn-forward', 'forward'); setupButton('btn-back', 'back');
    setupButton('btn-brake', 'brake');

    // Cámara
    document.getElementById('btn-zoom-in').onclick = () => { if(cameraScale < 2) cameraScale += 0.1; };
    document.getElementById('btn-zoom-out').onclick = () => { if(cameraScale > 0.5) cameraScale -= 0.1; };
    document.getElementById('btn-zoom-reset').onclick = () => cameraScale = 1.0;
    document.getElementById('btn-fullscreen').onclick = () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    };

    function update() {
        // Manejo de volante (2.8 vueltas totales)
        if (inputs.left) car.wheelAngleDeg -= 5;
        if (inputs.right) car.wheelAngleDeg += 5;
        car.wheelAngleDeg = Math.max(-car.maxWheelAngle, Math.min(car.maxWheelAngle, car.wheelAngleDeg));

        // Tracción y Freno
        if (inputs.brake) car.speed *= 0.88;
        else if (inputs.forward) car.speed += car.accel;
        else if (inputs.back) car.speed -= car.accel;
        else car.speed *= car.friction;

        if (car.speed > car.maxSpeed) car.speed = car.maxSpeed;
        if (car.speed < -car.maxSpeed/2) car.speed = -car.maxSpeed/2;

        const steerAngleRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);
        if (Math.abs(car.speed) > 0.1) {
            car.angle += (steerAngleRad * car.speed) / 140;
        }

        car.x += Math.cos(car.angle) * car.speed;
        car.y += Math.sin(car.angle) * car.speed;

        // UI
        document.getElementById('vueltas').innerText = (car.wheelAngleDeg / 360).toFixed(2);
        document.getElementById('angRuedas').innerText = Math.round(car.wheelAngleDeg / car.steeringRatio);
        volanteUI.style.transform = `rotate(${car.wheelAngleDeg}deg)`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff"; // Fondo blanco puro
        ctx.fillRect(0,0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(cameraScale, cameraScale);
        ctx.translate(-car.x, -car.y);

        // Grid sutil
        ctx.strokeStyle = "#f0f0f0";
        const gridSize = 100;
        const startX = Math.floor((car.x - (canvas.width/2)/cameraScale) / gridSize) * gridSize - gridSize;
        const endX = startX + (canvas.width/cameraScale) + gridSize * 2;
        const startY = Math.floor((car.y - (canvas.height/2)/cameraScale) / gridSize) * gridSize - gridSize;
        const endY = startY + (canvas.height/cameraScale) + gridSize * 2;
        ctx.beginPath();
        for(let x=startX; x<endX; x+=gridSize){ ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
        for(let y=startY; y<endY; y+=gridSize){ ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
        ctx.stroke();

        // Conos
        cones.forEach(c => {
            ctx.fillStyle = "#e67e22"; ctx.beginPath(); ctx.arc(c.x, c.y, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(c.x, c.y, 4, 0, Math.PI*2); ctx.fill();
        });

        // Auto
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);
        ctx.fillStyle = "#2c3e50"; 
        ctx.fillRect(-car.height/2, -car.width/2, car.height, car.width);
        ctx.fillStyle = "#5dade2"; // Parabrisas
        ctx.fillRect(15, -car.width/2 + 5, 15, car.width - 10);
        
        const sRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);
        const drawW = (tx, ty, rot) => {
            ctx.save(); ctx.translate(tx, ty); ctx.rotate(rot);
            ctx.fillStyle = "#333"; ctx.fillRect(-10, -5, 20, 10); ctx.restore();
        };
        drawW(25, -20, sRad); drawW(25, 20, sRad); // Delanteras
        drawW(-25, -20, 0); drawW(-25, 20, 0); // Traseras
        ctx.restore();

        ctx.restore();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
</script>
</body>
</html>
