<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador Pro - White Screen</title>
    <style>
        /* Fondo blanco para el inicio */
        body { margin: 0; background: #ffffff; color: #333; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; background: #ffffff; }
        
        .ui { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 8px; border: 1px solid #ccc; pointer-events: none; }
        
        /* Controles táctiles */
        .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; box-sizing: border-box; }
        .btn { width: 100px; height: 100px; border-radius: 50%; border: none; font-weight: bold; color: white; cursor: pointer; -webkit-user-select: none; }
        #gas { background: #27ae60; box-shadow: 0 5px #1e8449; }
        #gas:active { transform: translateY(4px); box-shadow: 0 2px #1e8449; }
        #handbrake { background: #c0392b; box-shadow: 0 5px #922b21; }
        #handbrake:active { background: #e74c3c; }

        /* Overlay de inicio */
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        #start-btn { padding: 20px 40px; font-size: 24px; background: #333; color: white; border: none; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1>Simulador de Volante</h1>
        <p>Gira el celular para direccionar</p>
        <button id="start-btn">INICIAR SIMULADOR</button>
    </div>

    <div class="ui">
        Vueltas Volante: <span id="vueltas">0.00</span><br>
        Velocidad: <span id="speedVal">0</span> km/h
    </div>

    <div class="controls" id="game-controls" style="display: none;">
        <button class="btn" id="handbrake">FRENO DE MANO</button>
        <button class="btn" id="gas">ACELERAR</button>
    </div>

    <canvas id="simCanvas"></canvas>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    // Variables de estado
    let isAccelerating = false;
    let isHandbraking = false;
    let tiltX = 0;
    let sensorActive = false;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const car = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        width: 40,
        height: 80,
        angle: -Math.PI / 2,
        wheelAngleDeg: 0,
        maxWheelAngle: 720, // 2 vueltas
        steeringRatio: 16,
        speed: 0,
        maxSpeed: 8,
        friction: 0.98,
        brakeForce: 0.85
    };

    // Eventos de botones
    const gasBtn = document.getElementById('gas');
    const brakeBtn = document.getElementById('handbrake');

    gasBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isAccelerating = true; });
    gasBtn.addEventListener('touchend', () => isAccelerating = false);
    
    brakeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isHandbraking = true; });
    brakeBtn.addEventListener('touchend', () => isHandbraking = false);

    // Permisos y Sensores
    document.getElementById('start-btn').onclick = function() {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(response => { if (response == 'granted') activateSensors(); })
                .catch(console.error);
        } else {
            activateSensors();
        }
    };

    function activateSensors() {
        window.addEventListener('deviceorientation', (e) => {
            // Gamma es la inclinación lateral (izquierda/derecha)
            tiltX = e.gamma;
            sensorActive = true;
        });
        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('game-controls').style.display = 'flex';
    }

    function update() {
        // 1. Dirección con Giro del Celular (Acumulativa)
        if (sensorActive) {
            // Zona muerta de 5 grados para estabilidad
            if (Math.abs(tiltX) > 5) {
                // El volante gira proporcionalmente a la inclinación del cel
                car.wheelAngleDeg += (tiltX / 12);
            }
        }

        // Limitar vueltas del volante
        car.wheelAngleDeg = Math.max(-car.maxWheelAngle, Math.min(car.maxWheelAngle, car.wheelAngleDeg));

        // 2. Aceleración y Freno
        if (isHandbraking) {
            car.speed *= car.brakeForce;
            if (car.speed < 0.1) car.speed = 0;
        } else if (isAccelerating) {
            car.speed += 0.12;
            if (car.speed > car.maxSpeed) car.speed = car.maxSpeed;
        } else {
            car.speed *= car.friction;
        }

        // 3. Física de giro y posición
        const steerAngleRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);
        
        if (Math.abs(car.speed) > 0.1) {
            // Factor de giro (el coche gira más si vas rápido, pero con límite real)
            car.angle += (steerAngleRad * car.speed) / 120;
        }

        car.x += Math.cos(car.angle) * car.speed;
        car.y += Math.sin(car.angle) * car.speed;

        // Mantener el auto en pantalla (Toroidal)
        if (car.x > canvas.width) car.x = 0;
        if (car.x < 0) car.x = canvas.width;
        if (car.y > canvas.height) car.y = 0;
        if (car.y < 0) car.y = canvas.height;

        // UI
        document.getElementById('vueltas').innerText = (car.wheelAngleDeg / 360).toFixed(2);
        document.getElementById('speedVal').innerText = Math.round(car.speed * 15);
    }

    function draw() {
        ctx.fillStyle = "white"; // Fondo siempre blanco
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);

        // Chasis del auto
        ctx.fillStyle = "#34495e";
        ctx.fillRect(-car.height/2, -car.width/2, car.height, car.width);
        
        // Luces traseras si frena
        if (isHandbraking) {
            ctx.fillStyle = "red";
            ctx.fillRect(-car.height/2, -car.width/2, 5, 10);
            ctx.fillRect(-car.height/2, car.width/2 - 10, 5, 10);
        }

        // Ruedas delanteras (visualizan la inclinación)
        const steerAngleRad = (car.wheelAngleDeg / car.steeringRatio) * (Math.PI / 180);
        drawWheel(25, -20, steerAngleRad);
        drawWheel(25, 20, steerAngleRad);

        ctx.restore();
    }

    function drawWheel(x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillStyle = "#333";
        ctx.fillRect(-10, -4, 20, 8);
        // Marca en la rueda para ver el giro
        ctx.fillStyle = "#555";
        ctx.fillRect(0, -4, 2, 8);
        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
